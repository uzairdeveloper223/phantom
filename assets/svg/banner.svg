<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00ff88;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#00ff88;stop-opacity:0"/>
    </linearGradient>
    <radialGradient id="radar" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#00ff88;stop-opacity:0.08"/>
      <stop offset="60%" style="stop-color:#00ff88;stop-opacity:0.03"/>
      <stop offset="100%" style="stop-color:#00ff88;stop-opacity:0"/>
    </radialGradient>
    <filter id="textGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="subtleGlow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bg)"/>

  <!-- Grid lines -->
  <g stroke="#00ff88" stroke-opacity="0.06" stroke-width="0.5">
    <line x1="0" y1="50" x2="1200" y2="50"/>
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="250" x2="1200" y2="250"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="350" x2="1200" y2="350"/>
    <line x1="100" y1="0" x2="100" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="300" y1="0" x2="300" y2="400"/>
    <line x1="400" y1="0" x2="400" y2="400"/>
    <line x1="500" y1="0" x2="500" y2="400"/>
    <line x1="600" y1="0" x2="600" y2="400"/>
    <line x1="700" y1="0" x2="700" y2="400"/>
    <line x1="800" y1="0" x2="800" y2="400"/>
    <line x1="900" y1="0" x2="900" y2="400"/>
    <line x1="1000" y1="0" x2="1000" y2="400"/>
    <line x1="1100" y1="0" x2="1100" y2="400"/>
  </g>

  <!-- Radar circle -->
  <circle cx="600" cy="200" r="180" fill="url(#radar)"/>
  <circle cx="600" cy="200" r="180" fill="none" stroke="#00ff88" stroke-opacity="0.08" stroke-width="1"/>
  <circle cx="600" cy="200" r="120" fill="none" stroke="#00ff88" stroke-opacity="0.05" stroke-width="0.5"/>
  <circle cx="600" cy="200" r="60" fill="none" stroke="#00ff88" stroke-opacity="0.04" stroke-width="0.5"/>

  <!-- Radar sweep -->
  <path d="M600 200 L600 20 A180 180 0 0 1 720 55 Z" fill="#00ff88" fill-opacity="0.04"/>

  <!-- Crosshair -->
  <line x1="560" y1="200" x2="640" y2="200" stroke="#00ff88" stroke-opacity="0.1" stroke-width="0.5"/>
  <line x1="600" y1="160" x2="600" y2="240" stroke="#00ff88" stroke-opacity="0.1" stroke-width="0.5"/>

  <!-- Skull silhouette (subtle ghost) -->
  <g transform="translate(600,175)" opacity="0.06" fill="#ffffff">
    <ellipse cx="0" cy="-15" rx="45" ry="50"/>
    <rect x="-30" y="20" width="60" height="25" rx="5"/>
    <circle cx="-15" cy="-20" r="10" fill="#0a0a0a"/>
    <circle cx="15" cy="-20" r="10" fill="#0a0a0a"/>
    <rect x="-3" y="0" width="6" height="12" rx="2" fill="#0a0a0a"/>
  </g>

  <!-- Top bar -->
  <rect x="0" y="0" width="1200" height="3" fill="#00ff88" opacity="0.4"/>

  <!-- Bottom bar -->
  <rect x="0" y="397" width="1200" height="3" fill="#00ff88" opacity="0.4"/>

  <!-- Corner brackets -->
  <g stroke="#00ff88" stroke-opacity="0.3" stroke-width="2" fill="none">
    <polyline points="30,15 15,15 15,30"/>
    <polyline points="1170,15 1185,15 1185,30"/>
    <polyline points="30,385 15,385 15,370"/>
    <polyline points="1170,385 1185,385 1185,370"/>
  </g>

  <!-- Classification label -->
  <text x="600" y="80" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" fill="#00ff88" opacity="0.4" letter-spacing="8">CLASSIFIED  //  AUTONOMOUS TACTICAL OPERATOR</text>

  <!-- Main title -->
  <text x="600" y="210" text-anchor="middle" font-family="'Arial Black', 'Impact', sans-serif" font-size="96" fill="#ffffff" letter-spacing="20" filter="url(#textGlow)">PHANTOM</text>

  <!-- Underline accent -->
  <rect x="320" y="228" width="560" height="2" fill="#00ff88" opacity="0.5"/>

  <!-- Tagline -->
  <text x="600" y="275" text-anchor="middle" font-family="'Courier New', monospace" font-size="16" fill="#00ff88" opacity="0.6" letter-spacing="4" filter="url(#subtleGlow)">One call. One ghost. Zero witnesses.</text>

  <!-- Version badge -->
  <rect x="525" y="300" width="150" height="24" rx="4" fill="#00ff88" fill-opacity="0.1" stroke="#00ff88" stroke-opacity="0.3" stroke-width="1"/>
  <text x="600" y="316" text-anchor="middle" font-family="'Courier New', monospace" font-size="12" fill="#00ff88" opacity="0.7">GTA V  |  SHVDN3</text>

  <!-- Side labels -->
  <text x="50" y="370" font-family="'Courier New', monospace" font-size="10" fill="#444444">SYS::PHANTOM_v0.1.0</text>
  <text x="1150" y="370" text-anchor="end" font-family="'Courier New', monospace" font-size="10" fill="#444444">NET48 // x64</text>
</svg>
