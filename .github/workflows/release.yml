name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build Release
        run: |
          dotnet build -c Release -p:OutputPath=./release-out /p:DefineConstants=SHVDN3

      - name: Prepare release package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ./release-pkg/scripts
          Copy-Item ./release-out/PHANTOM.dll ./release-pkg/scripts/
          Copy-Item ./PHANTOM.ini ./release-pkg/scripts/
          Compress-Archive -Path ./release-pkg/* -DestinationPath ./PHANTOM-${{ github.ref_name }}.zip

      - name: Extract changelog
        id: changelog
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          if [ -f CHANGELOG.md ]; then
            BODY=$(awk "/^## ${TAG}/ {found=1; next} /^## v/ {if(found) exit} found" CHANGELOG.md)
          else
            BODY="Release ${TAG}"
          fi
          echo "body<<EOF" >> $GITHUB_OUTPUT
          echo "$BODY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "PHANTOM ${{ github.ref_name }}"
          body: ${{ steps.changelog.outputs.body }}
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          files: |
            PHANTOM-${{ github.ref_name }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
